<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уналт илрүүлэгч (Mobile Responsive)</title>
    <style>
        body { 
            margin: 0; 
            padding: 10px; 
            font-family: sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
            min-height: 100vh;
        }
        h2 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
        }
        /* Утсанд тааруулж автоматаар хэмжээгээ өөрчлөх Container */
        .container { 
            position: relative; 
            width: 100%; 
            max-width: 980px; 
            aspect-ratio: 980 / 740; /* Унаган харьцааг хадгалах */
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        video { 
            display: none; /* Харагдахгүй, зөвхөн canvas дээр зурна */ 
        }
        /* Canvas нь container-ын 100% зайг эзлэнэ */
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        #loading { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: clamp(16px, 4vw, 24px); 
            color: #00ff00; 
            text-align: center;
            width: 90%;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>Уналт & Хөдөлгөөнгүй байдал илрүүлэгч</h2>
    <div class="container">
        <div id="loading">Моделуудыг ачаалж байна, түр хүлээнэ үү...</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="980" height="740"></canvas>
    </div>

    <script>
        // ── Тохиргооны утгууд ─────────────────────────────────────────────────────────
        const YOLO_CONF_THRESHOLD = 0.60;
        const FALL_VELOCITY_THRESHOLD = 0.5;
        const MOTIONLESS_PIXEL_THRESHOLD = 6;
        const MOTIONLESS_TIME_LIMIT = 15.0;
        
        // ── Төлөв хадгалах хувьсагчууд ───────────────────────────────────────────────
        let prevHipPos = null;
        let prevY = null;
        let prevTime = performance.now() / 1000;
        let motionlessStart = null;
        let alertTriggered = false;
        let fallAlertTriggered = false;
        let frameCount = 0;

        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        let objectDetector;

        // ── Туслах функц ──────────────────────────────────────────────────────────────
        function calculateAngle(a, b) {
            const dy = b.y - a.y;
            const dx = b.x - a.x;
            let theta = Math.atan2(dy, dx) * 180.0 / Math.PI;
            return Math.abs(theta);
        }

        // Текстийн хэмжээг утсанд илүү тод харагдуулахын тулд бага зэрэг томсгов
        function drawText(text, x, y, color, size = "28px") {
            canvasCtx.fillStyle = color;
            canvasCtx.font = `bold ${size} Arial`;
            canvasCtx.fillText(text, x, y);
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // ҮНДСЭН ГҮЙЦЭТГЭЛ
        // ══════════════════════════════════════════════════════════════════════════════
        async function initialize() {
            // 1. COCO-SSD ачаалах
            objectDetector = await cocoSsd.load();

            // 2. MediaPipe Pose ачаалах
            const pose = new Pose({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }});
            
            pose.setOptions({
                modelComplexity: 1, // Гар утсанд 0 эсвэл 1 тохиромжтой (илүү хурдан)
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            // 3. Камер ачаалах (Арын камерыг ашиглахыг оролдоно)
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                width: 980,
                height: 740,
                facingMode: 'environment' // Утасны арын камер
            });
            camera.start();
        }

        async function onPoseResults(results) {
            loadingElement.style.display = 'none';
            
            const w = canvasElement.width;
            const h = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            const currentTime = performance.now() / 1000;
            const dt = Math.max(currentTime - prevTime, 0.001);
            prevTime = currentTime;

            let status = "Normal";
            let color = "#00FF00";
            let angle = 0;
            let v_y = 0.0;
            let yoloFall = false;
            let poseFall = false;
            let fallPositions = [];

            // Object Detection (Bounding Box)
            const predictions = await objectDetector.detect(videoElement);
            
            predictions.forEach(prediction => {
                if (prediction.class === 'person' && prediction.score >= YOLO_CONF_THRESHOLD) {
                    const [x, y, width, height] = prediction.bbox;
                    const confPct = Math.round(prediction.score * 100);

                    canvasCtx.beginPath();
                    canvasCtx.rect(x, y, width, height);
                    canvasCtx.lineWidth = 4;
                    canvasCtx.strokeStyle = "#FF00FF";
                    canvasCtx.stroke();
                    drawText(`Person ${confPct}%`, x + 5, y - 10, "#FF00FF", "22px");

                    if (width > height) {
                        yoloFall = true;
                        fallPositions.push({x, y});
                    }
                }
            });

            // MediaPipe Pose Tracking
            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const ls = landmarks[11];
                const lh = landmarks[23];

                if (ls.visibility > 0.5 && lh.visibility > 0.5) {
                    angle = calculateAngle(ls, lh);
                    const currentHipPos = { x: lh.x * w, y: lh.y * h };
                    const currentY = lh.y; 

                    if (prevY !== null) {
                        v_y = (currentY - prevY) / dt;
                        if ((angle < 45 || angle > 135) && v_y > FALL_VELOCITY_THRESHOLD) {
                            poseFall = true;
                        }
                    }
                    prevY = currentY;

                    if (prevHipPos !== null) {
                        const dist = Math.hypot(currentHipPos.x - prevHipPos.x, currentHipPos.y - prevHipPos.y);
                        
                        if (dist < MOTIONLESS_PIXEL_THRESHOLD) {
                            if (motionlessStart === null) {
                                motionlessStart = currentTime;
                            } else {
                                const elapsed = currentTime - motionlessStart;
                                drawText(`Still: ${Math.floor(elapsed)}s`, 20, h - 40, "#FFA500", "36px");
                                
                                if (elapsed >= MOTIONLESS_TIME_LIMIT) {
                                    status = "ALERT: MOTIONLESS 15S!";
                                    color = "#FF0000";
                                    if (!alertTriggered) {
                                        console.warn("ALERT: MOTIONLESS!");
                                        alertTriggered = true;
                                    }
                                }
                            }
                        } else {
                            motionlessStart = null;
                            alertTriggered = false;
                        }
                    }
                    prevHipPos = currentHipPos;

                    drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 4});
                    
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(ls.x * w, ls.y * h);
                    canvasCtx.lineTo(currentHipPos.x, currentHipPos.y);
                    canvasCtx.strokeStyle = "#FFFF00";
                    canvasCtx.lineWidth = 5;
                    canvasCtx.stroke();
                }
            } else {
                motionlessStart = null;
                alertTriggered = false;
                prevY = null;
            }

            // Fall Detection Logic
            if (yoloFall || poseFall) {
                status = "FALL DETECTED!";
                color = "#FF0000";

                fallPositions.forEach(pos => {
                    drawText("FALL DETECTED", pos.x, Math.max(pos.y - 40, 30), "#FF0000", "40px");
                });

                if (poseFall && fallPositions.length === 0) {
                    drawText("FALL DETECTED", 20, h - 80, "#FF0000", "40px");
                }

                if (!fallAlertTriggered) {
                    console.warn("ALERT: FALL DETECTED!");
                    fallAlertTriggered = true;
                }
            } else {
                fallAlertTriggered = false;
            }

            // HUD
            drawText(`Status: ${status}`, 20, 60, color, "36px");
            drawText(`Angle: ${Math.round(angle)} deg`, 20, 110, color, "28px");
            drawText(`Vy: ${v_y.toFixed(2)}`, 20, 150, color, "28px");
            
            drawText(`Box (YOLO): ${yoloFall ? 'FALL' : 'OK'}`, 20, 200, yoloFall ? "#FF0000" : "#00FF00", "26px");
            drawText(`Pose (Skltn): ${poseFall ? 'FALL' : 'OK'}`, 20, 240, poseFall ? "#FF0000" : "#00FF00", "26px");
            
            const fps = Math.round(1 / dt);
            drawText(`FPS: ${fps}`, 20, 280, "#B4B4B4", "24px");

            canvasCtx.restore();
        }

        window.onload = initialize;
    </script>
</body>
</html>
