<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ухаалаг r-PPG Монитор</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px; /* Компьютер дээр хэт томрохгүй байх */
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Утасны камер ажиллах видео (Далд ажиллаж Canvas руу шиднэ) */
        video {
            display: none; 
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Дэлгэц дүүргэх */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff50;
            font-size: 1.1rem;
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading">Камер болон AI ачаалж байна...<br><span style="font-size:0.8rem; color:#aaa;">Гэрэлтэй орчинд утсаа хөдөлгөхгүй барина уу</span></div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const ctx = canvasElement.getContext('2d', { willReadFrequently: true }); // Гар утасны перформанс сайжруулах
const loadingElement = document.getElementById('loading');

// Системийн тохиргоонууд
const BUFFER_SIZE = 150; 
const EMA_ALPHA = 0.15;

let green_buf = [];
let red_buf = [];
let blue_buf = [];
let times_buf = [];

let bpm = 0.0;
let spo2 = 0.0;
let quality = 0.0;
let lastFaceTime = Date.now();

// Туслах математик функцууд
const getMean = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
const getStd = (arr, mean) => Math.sqrt(arr.reduce((sq, n) => sq + Math.pow(n - mean, 2), 0) / arr.length);

// Зүрхний цохилт болон Сигналын чанар тооцоолох (DFT)
function computeDFT(signal, fs) {
    const N = signal.length;
    let maxMag = 0, peakFreq = 0, totalPower = 1e-8;

    for (let k = 0; k <= Math.floor(N / 2); k++) {
        let re = 0, im = 0;
        const freq = (k * fs) / N;

        for (let n = 0; n < N; n++) {
            const angle = (2 * Math.PI * k * n) / N;
            re += signal[n] * Math.cos(angle);
            im -= signal[n] * Math.sin(angle);
        }

        const mag = Math.sqrt(re * re + im * im);
        
        if (freq >= 0.75 && freq <= 3.0) { // 45 - 180 BPM
            totalPower += mag * mag;
            if (mag > maxMag) { maxMag = mag; peakFreq = freq; }
        } else {
            totalPower += mag * mag; 
        }
    }
    const snrQuality = Math.min(100.0, ((maxMag * maxMag) / totalPower) * 500.0);
    return { bpm: peakFreq * 60.0, quality: snrQuality };
}

// Pixel унших
function getROIMeanRGB(x, y, w, h) {
    if (w <= 0 || h <= 0) return { r: 0, g: 0, b: 0 };
    try {
        const imgData = ctx.getImageData(x, y, w, h);
        const data = imgData.data;
        let r = 0, g = 0, b = 0;
        const total = w * h;
        // Гар утас дээр гацаахгүйн тулд 4 пиксел алгасаж уншина (Downsampling)
        let count = 0;
        for (let i = 0; i < data.length; i += 16) { 
            r += data[i]; g += data[i + 1]; b += data[i + 2];
            count++;
        }
        return { r: r / count, g: g / count, b: b / count };
    } catch (e) {
        return { r: 0, g: 0, b: 0 };
    }
}

// Дэлгэцийн мэдээлэл зурах
function drawHUD(W, H, bufFrac) {
    ctx.fillStyle = "rgba(15, 15, 15, 0.7)";
    ctx.fillRect(0, 0, W, 120);

    const bpmOk = bpm > 45 && bpm < 180;
    ctx.fillStyle = bpmOk ? "#00ff50" : "#ff3c3c";
    ctx.font = "bold 24px -apple-system, sans-serif";
    ctx.fillText(`HR: ${bpm.toFixed(1)} BPM`, 20, 45);

    if (spo2 >= 95) ctx.fillStyle = "#00ff50";
    else if (spo2 >= 90) ctx.fillStyle = "#ffca00";
    else ctx.fillStyle = "#ff3c3c";
    ctx.fillText(`SpO2: ${spo2.toFixed(1)}%`, W / 2 + 10, 45);

    drawProgressBar(20, 75, W/2 - 40, 12, quality / 100.0, ctx.fillStyle, `Чанар: ${quality.toFixed(0)}%`);
    drawProgressBar(W/2 + 10, 75, W/2 - 40, 12, bufFrac, "#6478ff", `Уншиж байна: ${Math.floor(bufFrac * 100)}%`);

    ctx.fillStyle = "#aaa";
    ctx.font = "12px sans-serif";
    ctx.fillText("Зөвхөн баримжаа үзүүлэлт (Эмнэлгийн бус)", 20, 110);
}

function drawProgressBar(x, y, w, h, frac, color, label) {
    const f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = "#333"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;  ctx.fillRect(x, y, w * f, h);
    ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif";
    ctx.fillText(label, x, y - 6);
}

// MediaPipe үр дүн ажиллах
function onResults(results) {
    loadingElement.style.display = "none";
    
    // Гар утасны дэлгэцийн харьцааг тохируулах
    if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
    }

    const W = canvasElement.width;
    const H = canvasElement.height;

    // 1. ДҮРСИЙГ ТОЛЬ ШИГ ЭРГҮҮЛЖ ЗУРАХ (Mobile Mirroring)
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(results.image, 0, 0, W, H);
    ctx.restore(); 
    // Дүрс зурагдсаны дараа буцааж хэвийн болгоно. (Текст буруу харагдахаас сэргийлж)

    if (results.detections && results.detections.length > 0) {
        lastFaceTime = Date.now();
        const bbox = results.detections[0].boundingBox;

        // 2. БАЙРШЛЫГ ТОЛЬДСОН ДҮРСЭНД ТААРУУЛЖ ХӨРВҮҮЛЭХ
        // MediaPipe нь эх дүрсийн X координатыг өгнө. Бид дүрсийг эргүүлсэн тул X координатыг мөн урвуулна.
        const boxX = (1 - (bbox.xCenter + bbox.width / 2)) * W; 
        const boxY = (bbox.yCenter - bbox.height / 2) * H;
        const boxW = bbox.width * W;
        const boxH = bbox.height * H;

        // 3. ROI Координатууд
        const rois = {
            "Дух": { x: boxX + boxW * 0.25, y: boxY + boxH * 0.05, w: boxW * 0.5, h: boxH * 0.15 },
            "Хацар 1": { x: boxX + boxW * 0.10, y: boxY + boxH * 0.50, w: boxW * 0.20, h: boxH * 0.20 },
            "Хацар 2": { x: boxX + boxW * 0.70, y: boxY + boxH * 0.50, w: boxW * 0.20, h: boxH * 0.20 }
        };

        // Хайрцаг зурах
        ctx.strokeStyle = "rgba(220, 100, 20, 0.8)";
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        let sumG = 0, sumR = 0, sumB = 0, count = 0;

        ctx.lineWidth = 1.5;
        for (const [label, r] of Object.entries(rois)) {
            ctx.strokeStyle = label === "Дух" ? "#00ff50" : "#00c8ff";
            ctx.strokeRect(r.x, r.y, r.w, r.h);

            const colors = getROIMeanRGB(r.x, r.y, r.w, r.h);
            if (colors.g > 0) {
                sumR += colors.r; sumG += colors.g; sumB += colors.b;
                count++;
            }
        }

        // 4. СИГНАЛ БОЛОВСРУУЛАЛТ
        if (count > 0) {
            green_buf.push(sumG / count); red_buf.push(sumR / count); blue_buf.push(sumB / count);
            times_buf.push(performance.now());

            if (green_buf.length > BUFFER_SIZE) {
                green_buf.shift(); red_buf.shift(); blue_buf.shift(); times_buf.shift();
            }

            if (green_buf.length === BUFFER_SIZE) {
                const totalTimeSec = (times_buf[times_buf.length - 1] - times_buf[0]) / 1000.0;
                const fps = times_buf.length / totalTimeSec;

                const meanG = getMean(green_buf);
                const g_detrended = green_buf.map(v => v - meanG);

                const dftRes = computeDFT(g_detrended, fps);
                
                const dc_r = getMean(red_buf), dc_b = getMean(blue_buf);
                const ac_r = getStd(red_buf, dc_r), ac_b = getStd(blue_buf, dc_b);

                let raw_spo2 = 0;
                if (dc_r > 1 && dc_b > 1 && ac_b > 1e-6) {
                    const R_ratio = (ac_r / dc_r) / (ac_b / dc_b);
                    raw_spo2 = Math.min(100, Math.max(85, 110.0 - 25.0 * R_ratio));
                }

                quality = dftRes.quality;
                bpm = bpm === 0 ? dftRes.bpm : (EMA_ALPHA * dftRes.bpm + (1 - EMA_ALPHA) * bpm);
                if (raw_spo2 > 0) spo2 = spo2 === 0 ? raw_spo2 : (EMA_ALPHA * raw_spo2 + (1 - EMA_ALPHA) * spo2);
            }
        }
    } else {
        if (Date.now() - lastFaceTime > 1000) {
            green_buf = []; red_buf = []; blue_buf = []; times_buf = [];
            bpm = 0; spo2 = 0; quality = 0;
        }
    }

    drawHUD(W, H, green_buf.length / BUFFER_SIZE);
}

// MediaPipe Face Detection тохиргоо
const faceDetection = new FaceDetection({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});
faceDetection.setOptions({
    model: 'short', // Утсанд зориулсан хөнгөн загвар (Ойр зайд сайн танина)
    minDetectionConfidence: 0.5
});
faceDetection.onResults(onResults);

// УТАСНЫ УРД КАМЕРЫГ ХҮЧЭЭР ДУУДАХ (facingMode: 'user')
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "user", // Утсан дээр селфи камерыг автоматаар нээнэ
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });
        videoElement.srcObject = stream;
        
        // Камер ассаны дараа MediaPipe-д тасралтгүй дүрс илгээх
        videoElement.addEventListener('play', () => {
            const sendFrame = async () => {
                if (!videoElement.paused && !videoElement.ended) {
                    await faceDetection.send({image: videoElement});
                    requestAnimationFrame(sendFrame); // Гар утасны дэлгэцийн шинэчлэлттэй уялдуулна
                }
            };
            sendFrame();
        });
    } catch (err) {
        loadingElement.innerHTML = "Камерт хандах эрх олдсонгүй эсвэл алдаа гарлаа!<br><br>Та хөтчийн тохиргооноос камер ашиглах зөвшөөрөл өгнө үү.";
        loadingElement.style.color = "red";
    }
}

startCamera();

</script>
</body>
</html>
