<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactless r-PPG Monitor</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        video {
            display: none; /* Камерыг далд ажиллуулж, canvas дээр зурна */
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff50;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading">Камер болон AI ачаалж байна...</div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const loadingElement = document.getElementById('loading');

// Тохиргоо (Python кодтой ижил)
const BUFFER_SIZE = 150; // ~5 секунд (30fps үед)
const EMA_ALPHA = 0.15;  // Хөдөлгөөн зөөлрүүлэгч

let green_buf = [];
let red_buf = [];
let blue_buf = [];
let times_buf = [];

let bpm = 0.0;
let spo2 = 0.0;
let quality = 0.0;
let lastFaceTime = Date.now();

// Массив дундаж олох функц
function getMean(arr) {
    return arr.reduce((a, b) => a + b, 0) / arr.length;
}

// Стандарт хазайлт олох функц
function getStd(arr, mean) {
    let sum = 0;
    for (let i = 0; i < arr.length; i++) {
        sum += Math.pow(arr[i] - mean, 2);
    }
    return Math.sqrt(sum / arr.length);
}

// Шууд DFT (Discrete Fourier Transform) - Зурвас шүүлтүүр болон FFT-ийн үүргийг зэрэг гүйцэтгэнэ
function computeDFT(signal, fs) {
    const N = signal.length;
    let maxMag = 0;
    let peakFreq = 0;
    let totalPower = 1e-8;

    // Зөвхөн 0.75Hz - 3.0Hz (45 - 180 BPM) хоорондох давтамжийг шүүнэ
    for (let k = 0; k <= Math.floor(N / 2); k++) {
        let re = 0;
        let im = 0;
        const freq = (k * fs) / N;

        for (let n = 0; n < N; n++) {
            const angle = (2 * Math.PI * k * n) / N;
            re += signal[n] * Math.cos(angle);
            im -= signal[n] * Math.sin(angle);
        }

        const mag = Math.sqrt(re * re + im * im);
        
        if (freq >= 0.75 && freq <= 3.0) {
            totalPower += mag * mag;
            if (mag > maxMag) {
                maxMag = mag;
                peakFreq = freq;
            }
        } else {
            // Энэ хэсэг нь Butterworth bandpass шүүлтүүртэй ижил үүрэг гүйцэтгэнэ
            totalPower += mag * mag; 
        }
    }

    const peakPower = maxMag * maxMag;
    const snrQuality = Math.min(100.0, (peakPower / totalPower) * 500.0);

    return { bpm: peakFreq * 60.0, quality: snrQuality };
}

// ROI (Ажиглах бүс)-ийн RGB дунджийг пикселээр тооцоолох
function getROIMeanRGB(ctx, x, y, w, h) {
    if (w <= 0 || h <= 0) return { r: 0, g: 0, b: 0 };
    try {
        const imgData = ctx.getImageData(x, y, w, h);
        const data = imgData.data;
        let r = 0, g = 0, b = 0;
        const total = w * h;
        for (let i = 0; i < data.length; i += 4) {
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
        }
        return { r: r / total, g: g / total, b: b / total };
    } catch (e) {
        return { r: 0, g: 0, b: 0 };
    }
}

// HUD (Дэлгэцийн мэдээлэл) зурах функц
function drawHUD(ctx, w, h, bufFrac) {
    // Дээд талын хагас тунгалаг хавтан
    ctx.fillStyle = "rgba(18, 18, 18, 0.65)";
    ctx.fillRect(0, 0, w, 110);

    // Зүрхний цохилт (BPM)
    const bpmOk = bpm > 45 && bpm < 180;
    ctx.fillStyle = bpmOk ? "#00ff50" : "#ff3c3c";
    ctx.font = "bold 22px Arial";
    ctx.fillText(`HR: ${bpm.toFixed(1)} BPM`, 20, 45);

    // SpO2
    if (spo2 >= 95) ctx.fillStyle = "#00ff50";
    else if (spo2 >= 90) ctx.fillStyle = "#ffca00";
    else ctx.fillStyle = "#ff3c3c";
    ctx.fillText(`SpO2: ${spo2.toFixed(1)}%`, w / 2, 45);

    // Доод тайлбар
    ctx.fillStyle = "#828282";
    ctx.font = "11px Arial";
    ctx.fillText("SpO2 нь баримжаа үзүүлэлт — Эмнэлгийн зориулалтаар ашиглаж болохгүй", 15, h - 15);

    // Прогресс барууд
    drawProgressBar(ctx, 20, 70, 180, 12, quality / 100.0, ctx.fillStyle, `Чанар: ${quality.toFixed(0)}%`);
    drawProgressBar(ctx, w / 2, 70, 180, 12, bufFrac, "#6478ff", `Буфер: ${Math.floor(bufFrac * 100)}%`);
}

function drawProgressBar(ctx, x, y, w, h, frac, color, label) {
    const f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = "#2d2d2d";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * f, h);
    ctx.fillStyle = "#c8c8c8";
    ctx.font = "11px Arial";
    ctx.fillText(label, x + w + 8, y + h - 2);
}

// Царай таних үр дүн боловсруулах
function onResults(results) {
    loadingElement.style.display = "none";
    
    // Canvas хэмжээг тохируулах
    if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
    }

    const W = canvasElement.width;
    const H = canvasElement.height;

    // Камерыг толь шиг харуулахын тулд canvas-ийг эргүүлж зурна
    canvasCtx.save();
    canvasCtx.translate(W, 0);
    canvasCtx.scale(-1, 1);
    canvasCtx.drawImage(results.image, 0, 0, W, H);
    canvasCtx.restore();

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        lastFaceTime = Date.now();
        const landmarks = results.multiFaceLandmarks[0];

        // Толь шиг эргүүлсэн тул баруун зүүн талыг тооцож bounding box олно
        let xMin = W, xMax = 0, yMin = H, yMax = 0;
        for (const lm of landmarks) {
            const cx = (1 - lm.x) * W; // Эргүүлэлтийг тооцсон X
            const cy = lm.y * H;
            if (cx < xMin) xMin = cx;
            if (cx > xMax) xMax = cx;
            if (cy < yMin) yMin = cy;
            if (cy > yMax) yMax = cy;
        }

        const boxW = xMax - xMin;
        const boxH = yMax - yMin;

        // ROI координатууд (Духан хэсэг, зүүн хацар, баруун хацар)
        const rois = {
            "Forehead": { x: xMin + boxW * 0.25, y: yMin + boxH * 0.05, w: boxW * 0.5, h: boxH * 0.13 },
            "Cheek L":  { x: xMin + boxW * 0.08, y: yMin + boxH * 0.45, w: boxW * 0.22, h: boxH * 0.22 },
            "Cheek R":  { x: xMin + boxW * 0.70, y: yMin + boxH * 0.45, w: boxW * 0.22, h: boxH * 0.22 }
        };

        // Царайны хайрцаг зурах
        canvasCtx.strokeStyle = "#dc6414";
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeRect(xMin, yMin, boxW, boxH);

        let sumG = 0, sumR = 0, sumB = 0;
        let count = 0;

        // Бүр бүсийг зурж, өнгөний утгыг авна
        canvasCtx.lineWidth = 1;
        for (const [label, r] of Object.entries(rois)) {
            canvasCtx.strokeStyle = label === "Forehead" ? "#00ff50" : "#00c8ff";
            canvasCtx.strokeRect(r.x, r.y, r.w, r.h);
            
            canvasCtx.fillStyle = canvasCtx.strokeStyle;
            canvasCtx.font = "10px Arial";
            canvasCtx.fillText(label, r.x, r.y - 4);

            const colors = getROIMeanRGB(canvasCtx, r.x, r.y, r.w, r.h);
            if (colors.g > 0) {
                sumR += colors.r; sumG += colors.g; sumB += colors.b;
                count++;
            }
        }

        if (count > 0) {
            green_buf.push(sumG / count);
            red_buf.push(sumR / count);
            blue_buf.push(sumB / count);
            times_buf.push(performance.now());

            if (green_buf.length > BUFFER_SIZE) {
                green_buf.shift(); red_buf.shift(); blue_buf.shift(); times_buf.shift();
            }

            // Буфер дүүрсэн үед тооцоолно
            if (green_buf.length === BUFFER_SIZE) {
                const totalTimeSec = (times_buf[times_buf.length - 1] - times_buf[0]) / 1000.0;
                const fps = times_buf.length / totalTimeSec;

                // Дохиог цэвэрлэх (Detrend - Дунджийг хасах)
                const meanG = getMean(green_buf);
                const g_detrended = green_buf.map(v => v - meanG);

                // Heart Rate & Quality тооцоолох (Green суваг хамгийн өндөр SNR-тай байдаг)
                const dftRes = computeDFT(g_detrended, fps);
                
                // SpO2 тооцоолох (Ratio of Ratios арга)
                const dc_r = getMean(red_buf);
                const dc_b = getMean(blue_buf);
                const ac_r = getStd(red_buf, dc_r);
                const ac_b = getStd(blue_buf, dc_b);

                let raw_spo2 = 0;
                if (dc_r > 1 && dc_b > 1 && ac_b > 1e-6) {
                    const R_ratio = (ac_r / dc_r) / (ac_b / dc_b);
                    raw_spo2 = 110.0 - 25.0 * R_ratio;
                    if (raw_spo2 > 100) raw_spo2 = 100;
                    if (raw_spo2 < 85) raw_spo2 = 85;
                }

                quality = dftRes.quality;

                // EMA Шүүлтүүрээр утгуудыг зөөлрүүлэх
                bpm = bpm === 0 ? dftRes.bpm : (EMA_ALPHA * dftRes.bpm + (1 - EMA_ALPHA) * bpm);
                if (raw_spo2 > 0) {
                    spo2 = spo2 === 0 ? raw_spo2 : (EMA_ALPHA * raw_spo2 + (1 - EMA_ALPHA) * spo2);
                }
            }
        }
    } else {
        // Хэрэв царай 1 секундээс удаан хугацаанд олдохгүй бол буферийг цэвэрлэнэ
        if (Date.now() - lastFaceTime > 1000) {
            green_buf = []; red_buf = []; blue_buf = []; times_buf = [];
            bpm = 0; spo2 = 0; quality = 0;
        }
    }

    // Дэлгэцийн HUD мэдээллийг зурах
    drawHUD(canvasCtx, W, H, green_buf.length / BUFFER_SIZE);
}

// MediaPipe тохиргоог асаах
const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});
faceMesh.onResults(onResults);

// Камерыг эхлүүлэх
const camera = new Camera(videoElement, {
    onFrame: async () => {
        await faceMesh.send({image: videoElement});
    },
    width: 640,
    height: 480
});
camera.start();
</script>
</body>
</html>
